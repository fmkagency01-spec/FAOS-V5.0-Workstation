# Render Blueprint — connect this GitHub repo in Render → New → Blueprint.
# rootDir: backend is required because FastAPI lives under /backend (not repo root).
services:
  - type: web
    name: faos-backend
    runtime: python
    rootDir: backend
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: CORS_ALLOW_ALL
        value: "true"
      - key: CORS_ALLOW_ORIGINS
        value: https://faos-v5-0-workstation.vercel.app,https://faos-v5-0-workstation-fmk2.vercel.app
      - key: FAOS_WORKSTATION_ORIGIN
        sync: false
      - key: FAOS_AUTONOMOUS_LOOP
        value: "true"
      - key: FAOS_ORCHESTRATE_INTERVAL_SEC
        value: "300"
      - key: CRON_SECRET
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: FAOS_BACKEND_API_KEY
        sync: false
      - key: FAOS_REQUIRE_BACKEND_API_KEY
        value: "true"
      - key: RESEND_API_KEY
        sync: false
      - key: FAOS_NOTIFY_FROM
        sync: false
      - key: FAOS_NOTIFY_DEFAULT_TO
        sync: false
      - key: TAC_CENTRAL_CORE_URL
        value: https://tac.fmk-ecosystem.internal/approve

  # External cron kick — complements in-process lifespan loop (keeps free tier warm)
  - type: cron
    name: faos-autonomous-tick
    runtime: python
    rootDir: backend
    plan: free
    schedule: "*/15 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python scripts/cron_orchestrate_tick.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: FAOS_BACKEND_BASE_URL
        value: https://faos-backend.onrender.com
      - key: FAOS_BACKEND_API_KEY
        sync: false
